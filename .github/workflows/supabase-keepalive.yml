name: "Supabase keep-alive"

# Disparador de respaldo del keep-alive de /api/cron/keepalive (ver
# docs/ops/supabase-keepalive.md). Vercel Cron (vercel.json) ya pega una
# vez por día (plan Hobby); este workflow corre más seguido y a otra hora
# para que un fallo puntual de uno no coincida con el del otro.

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        id: app
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.KEEPALIVE_URL }}?source=github"

      - name: "Fallback: Supabase Auth health"
        id: fallback
        if: steps.app.outcome == 'failure'
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health"

      - name: Fail job if both pings failed
        if: steps.app.outcome == 'failure' && steps.fallback.outcome == 'failure'
        run: exit 1
